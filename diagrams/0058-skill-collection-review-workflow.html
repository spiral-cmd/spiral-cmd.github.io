<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="tags" content="skill openclaw">
  <title>0058 Skill Collection Review Workflow</title>
  <style>
    body { margin: 0; background: #f4f3ef; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
    svg { max-width: 100%; height: auto; display: block; }
    .caption { margin-top: 1rem; font-size: 12px; color: #6b6960; }
  </style>
</head>
<body>
<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Skill Collection Review Workflow</title>
  <desc>Weekly cron triggers each agent to audit and consolidate their own Skill Workshop files in an isolated session. No delivery; changes land in-place.</desc>

  <style>
    text { fill: #1a1a18; }
    .muted { fill: #6b6960; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .body { font-size: 12px; }
    .small { font-size: 11px; }
    .heading { font-size: 14px; font-weight: 700; }
    .arrow { stroke: #6b6960; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .dot-ok { fill: #2a7a3b; }
    .dot-warn { fill: #b85c00; }
    .dot-idle { fill: #7a6a00; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b6960"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" fill="#f4f3ef" rx="8"/>

  <!-- Title -->
  <text x="26" y="34" class="heading" font-size="16" fill="#1a1a18">Skill Collection Review — Weekly Cycle</text>
  <text x="26" y="52" class="small muted" fill="#6b6960">Each agent audits its own Skill Workshop in an isolated session · no delivery · changes land in-place</text>

  <!-- TRIGGER -->
  <rect x="20" y="68" width="150" height="68" rx="6" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="95" y="88" text-anchor="middle" class="label" font-size="10" fill="#6b6960">TRIGGER</text>
  <text x="95" y="106" text-anchor="middle" class="body" font-weight="600" fill="#1a1a18">OpenClaw Cron</text>
  <text x="95" y="121" text-anchor="middle" class="small" fill="#6b6960">every 7 days per agent</text>

  <line x1="170" y1="102" x2="200" y2="102" class="arrow"/>

  <!-- SPAWN -->
  <rect x="200" y="68" width="136" height="68" rx="6" fill="#e8eef8" stroke="#2a5caa" stroke-width="1.5"/>
  <text x="268" y="88" text-anchor="middle" class="label" font-size="10" fill="#2a5caa">SPAWN</text>
  <text x="268" y="106" text-anchor="middle" class="body" font-weight="600" fill="#1a1a18">Isolated Session</text>
  <text x="268" y="121" text-anchor="middle" class="small" fill="#6b6960">sessionTarget: isolated</text>

  <line x1="268" y1="136" x2="268" y2="162" class="arrow"/>

  <!-- AGENTS label -->
  <text x="26" y="185" class="label" font-size="10" fill="#6b6960">AGENTS</text>

  <!-- cc -->
  <rect x="20" y="192" width="104" height="52" rx="5" fill="#f0ecf8" stroke="#4a2080" stroke-width="1.5"/>
  <text x="72" y="212" text-anchor="middle" class="body" font-weight="700" fill="#4a2080">cc</text>
  <text x="72" y="228" text-anchor="middle" class="small" fill="#4a2080">ok · 15h ago</text>
  <circle cx="103" cy="198" r="5" class="dot-ok"/>

  <!-- main/polo -->
  <rect x="134" y="192" width="104" height="52" rx="5" fill="#e8f0f8" stroke="#1a5c8a" stroke-width="1.5"/>
  <text x="186" y="212" text-anchor="middle" class="body" font-weight="700" fill="#1a5c8a">main (polo)</text>
  <text x="186" y="228" text-anchor="middle" class="small" fill="#1a5c8a">idle · never</text>
  <circle cx="232" cy="198" r="5" class="dot-idle"/>

  <!-- cato -->
  <rect x="248" y="192" width="104" height="52" rx="5" fill="#e8f5f2" stroke="#1a6b5c" stroke-width="1.5"/>
  <text x="300" y="212" text-anchor="middle" class="body" font-weight="700" fill="#1a6b5c">cato</text>
  <text x="300" y="228" text-anchor="middle" class="small" fill="#1a6b5c">idle · never</text>
  <circle cx="346" cy="198" r="5" class="dot-idle"/>

  <!-- io -->
  <rect x="362" y="192" width="104" height="52" rx="5" fill="#fef3e8" stroke="#7a3a00" stroke-width="1.5"/>
  <text x="414" y="212" text-anchor="middle" class="body" font-weight="700" fill="#7a3a00">io</text>
  <text x="414" y="228" text-anchor="middle" class="small" fill="#7a3a00">idle · never</text>
  <circle cx="460" cy="198" r="5" class="dot-idle"/>

  <!-- zeno -->
  <rect x="476" y="192" width="104" height="52" rx="5" fill="#f8ecf6" stroke="#6b2060" stroke-width="1.5"/>
  <text x="528" y="212" text-anchor="middle" class="body" font-weight="700" fill="#6b2060">zeno</text>
  <text x="528" y="228" text-anchor="middle" class="small" fill="#6b2060">idle · never</text>
  <circle cx="574" cy="198" r="5" class="dot-idle"/>

  <!-- codo -->
  <rect x="590" y="192" width="104" height="52" rx="5" fill="#ecf5ec" stroke="#2a5c2a" stroke-width="1.5"/>
  <text x="642" y="212" text-anchor="middle" class="body" font-weight="700" fill="#2a5c2a">codo</text>
  <text x="642" y="228" text-anchor="middle" class="small" fill="#2a5c2a">idle · never</text>
  <circle cx="688" cy="198" r="5" class="dot-idle"/>

  <!-- mezzo -->
  <rect x="704" y="192" width="104" height="52" rx="5" fill="#f8ecec" stroke="#5c1a1a" stroke-width="1.5"/>
  <text x="756" y="212" text-anchor="middle" class="body" font-weight="700" fill="#5c1a1a">mezzo</text>
  <text x="756" y="228" text-anchor="middle" class="small" fill="#5c1a1a">idle · never</text>
  <circle cx="802" cy="198" r="5" class="dot-idle"/>

  <!-- fan-out lines -->
  <line x1="268" y1="162" x2="72" y2="192" class="arrow"/>
  <line x1="268" y1="162" x2="186" y2="192" class="arrow"/>
  <line x1="268" y1="162" x2="300" y2="192" class="arrow"/>
  <line x1="268" y1="162" x2="414" y2="192" class="arrow"/>
  <line x1="268" y1="162" x2="528" y2="192" class="arrow"/>
  <line x1="268" y1="162" x2="642" y2="192" class="arrow"/>
  <line x1="268" y1="162" x2="756" y2="192" class="arrow"/>

  <line x1="414" y1="244" x2="414" y2="272" class="arrow"/>

  <!-- REVIEW PROCEDURE label -->
  <text x="26" y="268" class="label" font-size="10" fill="#6b6960">REVIEW PROCEDURE (per agent, in isolated session)</text>

  <!-- Step 1 -->
  <rect x="20" y="276" width="148" height="72" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="94" y="296" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">1 · Audit</text>
  <text x="94" y="312" text-anchor="middle" class="small" fill="#6b6960">List all dirs/files</text>
  <text x="94" y="326" text-anchor="middle" class="small" fill="#6b6960">Read every SKILL.md</text>
  <text x="94" y="340" text-anchor="middle" class="small" fill="#6b6960">Map triggers + roles</text>
  <line x1="168" y1="312" x2="188" y2="312" class="arrow"/>

  <!-- Step 2 -->
  <rect x="188" y="276" width="148" height="72" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="262" y="296" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">2 · Decide</text>
  <text x="262" y="312" text-anchor="middle" class="small" fill="#6b6960">Identify duplicates</text>
  <text x="262" y="326" text-anchor="middle" class="small" fill="#6b6960">contradictions, retired</text>
  <text x="262" y="340" text-anchor="middle" class="small" fill="#6b6960">guidance</text>
  <line x1="336" y1="312" x2="356" y2="312" class="arrow"/>

  <!-- Step 3 -->
  <rect x="356" y="276" width="148" height="72" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="430" y="296" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">3 · Consolidate</text>
  <text x="430" y="312" text-anchor="middle" class="small" fill="#6b6960">One home per purpose</text>
  <text x="430" y="326" text-anchor="middle" class="small" fill="#6b6960">Prune redundant content</text>
  <text x="430" y="340" text-anchor="middle" class="small" fill="#6b6960">Update cross-refs</text>
  <line x1="504" y1="312" x2="524" y2="312" class="arrow"/>

  <!-- Step 4 -->
  <rect x="524" y="276" width="148" height="72" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="598" y="296" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">4 · Verify</text>
  <text x="598" y="312" text-anchor="middle" class="small" fill="#6b6960">Re-read changed files</text>
  <text x="598" y="326" text-anchor="middle" class="small" fill="#6b6960">Check all refs valid</text>
  <text x="598" y="340" text-anchor="middle" class="small" fill="#6b6960">Clear entry points</text>
  <line x1="672" y1="312" x2="692" y2="312" class="arrow"/>

  <!-- Step 5 -->
  <rect x="692" y="276" width="108" height="72" rx="5" fill="#e8f5eb" stroke="#2a7a3b" stroke-width="1.5"/>
  <text x="746" y="296" text-anchor="middle" class="small" font-weight="700" fill="#2a7a3b">5 · Report</text>
  <text x="746" y="312" text-anchor="middle" class="small" fill="#2a7a3b">Changes + reasons</text>
  <text x="746" y="326" text-anchor="middle" class="small" fill="#2a7a3b">Unresolved scope</text>
  <text x="746" y="340" text-anchor="middle" class="small" fill="#2a7a3b">or no-change reason</text>

  <!-- Arrow to output -->
  <line x1="414" y1="348" x2="414" y2="376" class="arrow"/>

  <!-- OUTPUT label -->
  <text x="26" y="372" class="label" font-size="10" fill="#6b6960">OUTPUT &amp; CONSTRAINTS</text>

  <!-- In-place changes -->
  <rect x="20" y="380" width="200" height="56" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="120" y="400" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">Changes land in-place</text>
  <text x="120" y="416" text-anchor="middle" class="small" fill="#6b6960">Skill Workshop files edited directly</text>
  <text x="120" y="430" text-anchor="middle" class="small" fill="#6b6960">No staging / no PR</text>

  <!-- No delivery -->
  <rect x="234" y="380" width="160" height="56" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="314" y="400" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">No delivery</text>
  <text x="314" y="416" text-anchor="middle" class="small" fill="#6b6960">mode: none</text>
  <text x="314" y="430" text-anchor="middle" class="small" fill="#6b6960">Silent unless actionable</text>

  <!-- Tools -->
  <rect x="408" y="380" width="196" height="56" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="506" y="400" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">Allowed tools</text>
  <text x="506" y="416" text-anchor="middle" class="small" fill="#6b6960">ls · read · write · edit</text>
  <text x="506" y="430" text-anchor="middle" class="small" fill="#6b6960">apply_patch · exec · process</text>

  <!-- Scope -->
  <rect x="618" y="380" width="182" height="56" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1.5"/>
  <text x="709" y="400" text-anchor="middle" class="small" font-weight="700" fill="#1a1a18">Scope: own directory only</text>
  <text x="709" y="416" text-anchor="middle" class="small" fill="#6b6960">Each agent works only in</text>
  <text x="709" y="430" text-anchor="middle" class="small" fill="#6b6960">their Skill Workshop</text>

  <!-- LEGEND -->
  <rect x="20" y="454" width="780" height="86" rx="5" fill="#ffffff" stroke="#d8d6d0" stroke-width="1"/>
  <text x="36" y="474" class="label" font-size="10" fill="#6b6960">LEGEND</text>

  <circle cx="48" cy="493" r="5" class="dot-ok"/>
  <text x="58" y="497" class="small" fill="#1a1a18">Last run ok</text>

  <circle cx="136" cy="493" r="5" class="dot-idle"/>
  <text x="146" y="497" class="small" fill="#1a1a18">Idle / never run</text>

  <circle cx="248" cy="493" r="5" class="dot-warn"/>
  <text x="258" y="497" class="small" fill="#1a1a18">Consecutive errors</text>

  <line x1="360" y1="493" x2="390" y2="493" stroke="#6b6960" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="396" y="497" class="small" fill="#1a1a18">Scheduled flow</text>

  <line x1="480" y1="493" x2="510" y2="493" stroke="#6b6960" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="516" y="497" class="small" fill="#1a1a18">Fan-out (one session per agent)</text>

  <text x="36" y="522" class="small" fill="#6b6960">Each agent's 7-day interval is independently anchored — cc ran ok (15h ago), 6 others idle (never run), due in 2–6 days.</text>
</svg>
<p class="caption">Tags: skill · openclaw · Generated 2026-09-12</p>
</body>
</html>
