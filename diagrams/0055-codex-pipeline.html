<title>Codex Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --border: #d6d2c8;
  --text: #1a1924;
  --muted: #7a7690;
  --dim: #a8a4b8;

  --blue: #2356b0;
  --blue-bg: #edf1fc;
  --purple: #6840b8;
  --purple-bg: #f0ebfc;
  --green: #1a7a48;
  --green-bg: #e6f5ed;
  --red: #b82828;
  --red-bg: #fceaea;
  --amber: #b85c10;
  --amber-bg: #fdf2e4;
  --arrow: #b0abc8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12111e; --surface: #1c1b2e; --border: #2c2a45;
    --text: #e5e2f5; --muted: #9490b5; --dim: #5e5a7a;
    --blue: #7aa0f0; --blue-bg: #18244a;
    --purple: #b090f5; --purple-bg: #221848;
    --green: #4ec888; --green-bg: #0d2820;
    --red: #e07070; --red-bg: #2e1010;
    --amber: #e89020; --amber-bg: #2e1a06;
    --arrow: #4a4668;
  }
}
:root[data-theme="dark"] {
  --bg: #12111e; --surface: #1c1b2e; --border: #2c2a45;
  --text: #e5e2f5; --muted: #9490b5; --dim: #5e5a7a;
  --blue: #7aa0f0; --blue-bg: #18244a;
  --purple: #b090f5; --purple-bg: #221848;
  --green: #4ec888; --green-bg: #0d2820;
  --red: #e07070; --red-bg: #2e1010;
  --amber: #e89020; --amber-bg: #2e1a06;
  --arrow: #4a4668;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 32px 28px 48px;
}
h1 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 24px;
}
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 22px 24px 24px;
  margin-bottom: 14px;
  overflow-x: auto;
}
.section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 18px;
}
figure { margin: 0; }
figcaption {
  font-size: 12px;
  color: var(--muted);
  margin-top: 14px;
  font-style: italic;
  line-height: 1.5;
}
svg { max-width: 100%; height: auto; display: block; }
</style>

<h1>Codex — ingest &amp; read paths</h1>

</div>

<div class="section">

</div>
